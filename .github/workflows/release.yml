# 发布：推送 v* 标签（版本号须与 Cargo.toml 一致）后，用 GitHub 自带 runner 构建
# macOS arm64 / Windows x64 / Linux x64 安装包，生成 SHA256SUMS.txt 并创建 Release。
# 应用内的自动更新读取的就是这里发布的文件，文件名格式不要随意改（见 crates/mdeasy-app/src/update.rs）。
#
# 手动运行（Actions → Release → Run workflow）只构建并上传 Artifacts，不创建 Release，可用来试构建。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 Cargo.toml 中的版本 $VERSION 不一致"
            exit 1
          fi

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev

      - name: 测试核心库
        run: cargo test -p mdeasy-core

      # 签名与公证用组织级 Secret：APPLE_SIGN_P12（Developer ID 证书 p12 的 base64）、APPLE_SIGN_PASSWORD、
      # APPLE_NOTARY_KEY / APPLE_NOTARY_KEY_ID / APPLE_NOTARY_ISSUER（App Store Connect API Key）。
      # 缺少时退回临时签名，构建不中断。
      - name: 导入签名证书
        if: runner.os == 'macOS'
        env:
          APPLE_SIGN_P12: ${{ secrets.APPLE_SIGN_P12 }}
          APPLE_SIGN_PASSWORD: ${{ secrets.APPLE_SIGN_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [[ -z "$APPLE_SIGN_P12" || -z "$APPLE_SIGN_PASSWORD" ]]; then
            echo "::warning::缺少 APPLE_SIGN_* Secret，使用临时签名，不公证"
            exit 0
          fi
          if [[ -n "$APPLE_NOTARY_KEY" && -n "$APPLE_NOTARY_KEY_ID" && -n "$APPLE_NOTARY_ISSUER" ]]; then
            echo "NOTARIZE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::缺少 APPLE_NOTARY_* Secret，只签名不公证"
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_SIGN_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_SIGN_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [[ -z "$IDENTITY" ]]; then
            echo "p12 里没有 Developer ID Application 证书" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: 打包 macOS
        if: runner.os == 'macOS'
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          scripts/bundle-macos.sh --no-default
          codesign -dv target/release/MDEasy.app 2>&1 | grep -E "Authority|TeamIdentifier|flags" || true
          if [[ "${NOTARIZE:-}" == "1" ]]; then
            ditto -c -k --keepParent target/release/MDEasy.app "$RUNNER_TEMP/notarize.zip"
            scripts/notarize-macos.sh "$RUNNER_TEMP/notarize.zip" target/release/MDEasy.app
            spctl --assess --type execute -vv target/release/MDEasy.app
          fi
          mkdir -p dist
          ditto -c -k --keepParent target/release/MDEasy.app \
            "dist/MDEasy-${{ steps.version.outputs.version }}-macos-arm64.zip"

      - name: 清理签名钥匙串
        if: always() && runner.os == 'macOS' && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true

      - name: 打包 Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p mdeasy
          New-Item -ItemType Directory -Force pkg, dist | Out-Null
          Copy-Item target/release/mdeasy.exe pkg/
          Copy-Item README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "dist/MDEasy-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: 打包 Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p mdeasy
          NAME="MDEasy-${{ steps.version.outputs.version }}-linux-x64"
          mkdir -p "pkg/$NAME" dist
          cp target/release/mdeasy README.md "pkg/$NAME/"
          cp assets/icon/png/256.png "pkg/$NAME/mdeasy.png"
          cat > "pkg/$NAME/mdeasy.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MDEasy
          Comment=Markdown / JSON / YAML / TOML 编辑器
          Exec=mdeasy %F
          Icon=mdeasy
          Terminal=false
          Categories=Utility;TextEditor;Development;
          MimeType=text/markdown;application/json;application/yaml;application/toml;
          EOF
          tar -C pkg -czf "dist/$NAME.tar.gz" "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        working-directory: dist
        run: |
          sha256sum MDEasy-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MDEasy ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag

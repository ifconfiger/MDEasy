# 发布：推送 v* 标签（版本号须与 Cargo.toml 一致）后，用 GitHub 自带 runner 构建
# macOS arm64 / Windows x64 / Linux x64 安装包，生成 SHA256SUMS.txt 并创建 Release。
# 应用内的自动更新读取的就是这里发布的文件，文件名格式不要随意改（见 crates/mdeasy-app/src/update.rs）。
#
# 手动运行（Actions → Release → Run workflow）只构建并上传 Artifacts，不创建 Release，可用来试构建。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 Cargo.toml 中的版本 $VERSION 不一致"
            exit 1
          fi

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev

      - name: 测试核心库
        run: cargo test -p mdeasy-core

      - name: 打包 macOS
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh --no-default
          mkdir -p dist
          ditto -c -k --keepParent target/release/MDEasy.app \
            "dist/MDEasy-${{ steps.version.outputs.version }}-macos-arm64.zip"

      - name: 打包 Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p mdeasy
          New-Item -ItemType Directory -Force pkg, dist | Out-Null
          Copy-Item target/release/mdeasy.exe pkg/
          Copy-Item README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "dist/MDEasy-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: 打包 Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p mdeasy
          NAME="MDEasy-${{ steps.version.outputs.version }}-linux-x64"
          mkdir -p "pkg/$NAME" dist
          cp target/release/mdeasy README.md "pkg/$NAME/"
          cp assets/icon/png/256.png "pkg/$NAME/mdeasy.png"
          cat > "pkg/$NAME/mdeasy.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MDEasy
          Comment=Markdown / JSON / YAML / TOML 编辑器
          Exec=mdeasy %F
          Icon=mdeasy
          Terminal=false
          Categories=Utility;TextEditor;Development;
          MimeType=text/markdown;application/json;application/yaml;application/toml;
          EOF
          tar -C pkg -czf "dist/$NAME.tar.gz" "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        working-directory: dist
        run: |
          sha256sum MDEasy-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MDEasy ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag

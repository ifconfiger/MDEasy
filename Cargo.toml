[workspace]
resolver = "3"
members = ["crates/mdeasy-core", "crates/mdeasy-app", "tools/icon-gen"]
default-members = ["crates/mdeasy-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ifconfiger/MDEasy"

[workspace.dependencies]
mdeasy-core = { path = "crates/mdeasy-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1"
dirs = "7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

# GPUI 在 debug 下非常慢，依赖统一开优化，自身代码保持可调试
[profile.dev.package."*"]
opt-level = 2
